# =============================================================================
# Library Management System - Application Configuration
# =============================================================================
# IMPORTANT: Never hardcode real credentials here.
# Use environment variables (see README.md for setup instructions).
# =============================================================================

# ---- Spring Application Name ----
spring.application.name=library-management-system

# ---- Server Configuration ----
spring.main.web-application-type=servlet
server.port=8080

# ---- MySQL Database Connection ----
# DB_USERNAME and DB_PASSWORD can be set via env vars or fall back to standard local dev defaults.
spring.datasource.url=jdbc:mysql://localhost:3306/library_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- Hibernate / JPA Settings ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- JWT Configuration ----
# Secret defaults to a secure 256-bit key for local development if not provided in env.
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Token expiry: 86400000 ms = 24 hours
app.jwt.expiration-ms=86400000

# ---- Logging ----
logging.level.root=INFO
logging.level.com.librarymanagement=DEBUG

