# =============================================================================
# Test Configuration - uses H2 in-memory database
# This overrides application.properties during tests so that:
#   - Tests do NOT need MySQL to be running
#   - Tests do NOT need DB_USERNAME / DB_PASSWORD env vars
#   - Tests do NOT need JWT_SECRET env var (we use a fixed test secret)
# =============================================================================

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate - create schema fresh for each test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT - fixed test secret (NOT used in production, safe here as it's test-only)
# This is 64 characters = 512 bits, meeting HMAC-SHA512 minimum.
app.jwt.secret=testSecretKeyForJUnitTestsOnlyDoNotUseInProductionMustBe64CharsLong1234
app.jwt.expiration-ms=3600000
